<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라켓뚱보단 청백전</title>
<meta name="description" content="라켓뚱보단 청백전 11.27 실시간 점수판 — 패기팀 VS 짬바팀">
<meta name="theme-color" content="#20264F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청백전">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F4F7FC; --surface:#FFFFFF; --surface-2:#F8FAFD; --line:#DCE2EC; --line-2:#EBEFF5;
  --text:#202535; --text-2:#626C80; --navy:#20264F; --navy-50:#EEF0F8;
  --wht-50:#F3F5F9;
  --ta:#D93A33; --ta-d:#A42520; --ta-50:#FDEDEC; --ta-100:#F8D2CF;   /* 패기팀 */
  --tb:#2157D4; --tb-d:#173E9C; --tb-50:#E8EEFC; --tb-100:#D0DDFB;   /* 짬바팀 */
  --win:#21865B; --win-50:#E8F5EE; --yellow:#FFC928; --yellow-50:#FFF7DB; --danger:#D64545;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --brand:"Black Han Sans","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme: light;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 var(--font); }
button { font-family:inherit; }
.wrap { max-width:688px; margin:0 auto; padding:12px 16px 64px; }
.banner { display:block; width:100%; height:auto; aspect-ratio:1440/480; border-radius:18px; box-shadow:0 4px 14px rgba(23,40,110,.18); }
.when { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:8px 2px 0; font-size:12.5px; color:var(--text-2); }
.when b { color:var(--navy); }
.conn { flex:none; display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:20px; background:var(--wht-50); color:var(--text-2); }
.conn::before { content:""; width:7px; height:7px; border-radius:50%; background:#A0A8B8; }
.conn.ok { background:var(--win-50); color:var(--win); } .conn.ok::before { background:var(--win); }
.conn.bad { background:#FDEEEE; color:var(--danger); } .conn.bad::before { background:var(--danger); }

/* 점수판 */
.board { margin-top:10px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 2px 8px rgba(32,38,79,.06); padding:14px; }
.sb { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:stretch; }
.sbt { position:relative; border-radius:12px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; min-height:78px; color:#fff; }
.sbt.a { background:linear-gradient(135deg,#EC4D43,#A42520); }
.sbt.b { background:linear-gradient(135deg,#2E66E3,#163B95); flex-direction:row-reverse; }
.sbt .tn { font-family:var(--brand); font-size:24px; line-height:1; }
.sbt .tn small { display:block; font-family:var(--font); font-size:11px; font-weight:500; opacity:.85; margin-top:4px; }
.sbt.b .tn { text-align:right; }
.sbt .pt { font-family:var(--brand); font-size:50px; line-height:1; font-variant-numeric:tabular-nums; }
.sbt .lead { position:absolute; top:-9px; left:50%; transform:translateX(-50%); background:var(--yellow); color:#5A4300; font-size:11px; font-weight:800; padding:1px 8px; border-radius:10px; white-space:nowrap; }
.sbm { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-width:64px; }
.sbm .colon { font-family:var(--brand); font-size:30px; color:#B5BCCB; line-height:1; }
.sbm .msg { font-size:11.5px; font-weight:700; color:var(--navy); margin-top:4px; line-height:1.3; }
.sbs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px; }
.sbs button { border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:6px 4px 5px; cursor:pointer; position:relative; overflow:hidden; text-align:center; }
.sbs button::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--sc); }
.sbs .l { display:block; font-size:11.5px; font-weight:700; color:var(--sc); }
.sbs .v { font-family:var(--brand); font-size:22px; line-height:1.2; }
.sbs .v .a { color:var(--ta); } .sbs .v .b { color:var(--tb); } .sbs .v i { font-style:normal; color:#B5BCCB; margin:0 4px; }
.sbs small { display:block; font-size:10.5px; color:var(--text-2); }
.prog { margin-top:12px; }
.prog .bar { height:8px; border-radius:6px; background:var(--line-2); overflow:hidden; display:flex; }
.prog .bar span { display:block; height:100%; }
.prog .bar .a { background:var(--ta); } .prog .bar .b { background:var(--tb); }
.prog .txt { display:flex; justify-content:space-between; font-size:12px; color:var(--text-2); margin-top:5px; }
.recent { margin:10px 0 0; padding:0; list-style:none; border-top:1px dashed var(--line); padding-top:8px; }
.recent li { display:flex; align-items:center; gap:6px; font-size:12.5px; padding:2px 0; min-width:0; }
.recent .k { flex:none; font-size:11px; font-weight:700; color:var(--text-2); background:var(--wht-50); border-radius:6px; padding:0 6px; }
.recent .n { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.recent .s { flex:none; font-weight:800; font-variant-numeric:tabular-nums; }
.recent .mw { flex:none; font-size:11px; font-weight:800; color:#fff; border-radius:6px; padding:0 6px; }
.recent .mw.a { background:var(--ta); } .recent .mw.b { background:var(--tb); }
.recent .none { color:var(--text-2); }

/* 탭 */
.tabbar { position:sticky; top:0; z-index:30; background:var(--bg); padding:10px 0 6px; margin-top:4px; }
.tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:4px; box-shadow:0 2px 8px rgba(32,38,79,.06); }
.tabs button { border:0; background:transparent; color:var(--text-2); font-size:14px; font-weight:500; padding:9px 2px; border-radius:8px; cursor:pointer; }
.tabs button.on { background:var(--navy); color:#fff; font-weight:700; }
.subtabs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
.subtabs button { position:relative; overflow:hidden; background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 2px 7px; font-size:13px; font-weight:700; color:var(--text); cursor:pointer; }
.subtabs button::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--sc); }
.subtabs button.on { background:var(--sc); border-color:var(--sc); color:#fff; }
.subtabs button small { font-size:9.5px; font-weight:700; border:1px solid currentColor; border-radius:4px; padding:0 3px; margin-left:3px; opacity:.75; }

/* 공통 */
h2.sec { font-size:16px; margin:18px 2px 6px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
h2.sec small { font-size:12px; font-weight:500; color:var(--text-2); }
.chip { display:inline-block; background:var(--sl); color:var(--sc); font-weight:700; font-size:11.5px; padding:1px 7px; border-radius:6px; white-space:nowrap; }
.bd { display:inline-block; font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:6px; white-space:nowrap; }
.bd.wait { background:var(--wht-50); color:var(--text-2); }
.bd.live { background:var(--yellow-50); color:#8A6500; }
.bd.now { background:var(--yellow); color:#4A3700; }
.bd.wa { background:var(--ta); color:#fff; }
.bd.wb { background:var(--tb); color:#fff; }
.empty-note { text-align:center; color:var(--text-2); font-size:13px; padding:18px 0; }
input.sc { flex:none; width:48px; height:42px; border:1.5px solid var(--line); border-radius:8px; text-align:center; font:800 20px var(--font); color:var(--text); background:#fff; padding:0; font-variant-numeric:tabular-nums; }
input.sc:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(32,38,79,.16); }
input.sc.a { color:var(--ta-d); } input.sc.b { color:var(--tb-d); }
.flash { animation:flash 1.4s ease-out; }
@keyframes flash { 0%,30% { box-shadow:0 0 0 3px var(--navy); } 100% { box-shadow:0 0 0 0 transparent; } }
.just { animation:just 1.6s ease-out; }
@keyframes just { 0%,35% { box-shadow:0 0 0 3px var(--yellow); } 100% { box-shadow:0 0 0 0 transparent; } }

/* 판 카드 (코트) */
.gcard { background:#fff; border:1px solid var(--line); border-left:4px solid var(--sc); border-radius:12px; padding:10px 12px; margin:8px 0; scroll-margin-top:140px; }
.gcard.now { border-color:var(--yellow); border-left-color:var(--sc); box-shadow:0 0 0 2px var(--yellow); }
.gcard.done { background:var(--surface-2); }
.gcard header { display:flex; align-items:center; gap:6px; font-size:13px; flex-wrap:wrap; }
.gcard .wv { font-weight:800; color:var(--navy); }
.gcard .lbl { font-weight:600; color:var(--text-2); font-size:12px; }
.gcard .st { margin-left:auto; }
.row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-top:8px; }
.team { display:flex; align-items:center; justify-content:space-between; gap:8px; border-radius:10px; padding:7px 9px; min-width:0; border:1.5px solid transparent; }
.team.a { background:var(--ta-50); } .team.b { background:var(--tb-50); }
.nms { display:flex; flex-direction:column; font-weight:700; font-size:14px; line-height:1.35; min-width:0; }
.nms .tt { font-size:10.5px; font-weight:800; letter-spacing:.5px; }
.team.a .tt { color:var(--ta); } .team.b .tt { color:var(--tb); }
.team.b .nms { text-align:right; }
.nms span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vs { font-size:12px; color:var(--text-2); font-weight:700; }
[data-win="a"] .team.a { background:var(--ta-100); border-color:var(--ta); }
[data-win="b"] .team.b { background:var(--tb-100); border-color:var(--tb); }
.ml { margin-top:8px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-size:12px; color:var(--text-2); }
.ml-link { border:0; background:none; padding:0; font-size:12px; font-weight:700; color:var(--sc); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
.sline b.a { color:var(--ta); } .sline b.b { color:var(--tb); }

/* 코트 머리 */
.chead { display:flex; align-items:flex-end; justify-content:space-between; margin:14px 2px 4px; }
.chead h2 { font-family:var(--brand); font-weight:400; font-size:24px; margin:0; color:var(--navy); }
.chead h2 small { font-family:var(--font); font-size:12.5px; font-weight:500; color:var(--text-2); margin-left:6px; }
.chead .cnt { text-align:right; font-size:11.5px; color:var(--text-2); }
.chead .cnt b { display:block; font-size:17px; color:var(--navy); }
.tog { display:flex; justify-content:flex-end; margin:0 2px; }
.tog label { font-size:12.5px; color:var(--text-2); display:inline-flex; align-items:center; gap:5px; cursor:pointer; }
.hide-done .gcard.done:not(.now) { display:none; }

/* 시드 */
.shead { margin-top:12px; border-radius:14px; padding:16px; color:#fff; background:linear-gradient(135deg,var(--sc),var(--sd)); position:relative; overflow:hidden; min-height:96px; }
.shead h2 { font-family:var(--brand); font-weight:400; font-size:26px; margin:0; line-height:1.1; }
.shead p { margin:6px 0 0; font-size:12.5px; opacity:.92; line-height:1.5; }
.shead .ss { position:absolute; right:16px; top:14px; text-align:right; }
.shead .ss b { font-family:var(--brand); font-weight:400; font-size:30px; line-height:1; }
.shead .ss b i { font-style:normal; opacity:.6; margin:0 4px; }
.shead .ss small { display:block; font-size:11px; opacity:.9; }
.shead .ss strong { display:inline-block; margin-top:4px; background:rgba(255,255,255,.22); border-radius:6px; padding:1px 7px; font-size:12px; }
.mcard { background:#fff; border:1px solid var(--line); border-left:4px solid var(--sc); border-radius:12px; padding:9px 12px 10px; margin:8px 0; scroll-margin-top:140px; }
.mcard.done { background:var(--surface-2); }
.mcard > header { display:flex; align-items:center; gap:8px; font-size:13px; }
.mcard > header .no { font-weight:800; color:var(--sc); font-size:13.5px; }
.mcard > header .go { border:0; background:none; padding:0; color:var(--text-2); font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
.mcard > header .mr { margin-left:auto; }
.mrow { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px; align-items:center; margin-top:7px; }
.mrow .t { position:relative; border-radius:9px; padding:6px 9px; font-weight:700; font-size:13.5px; line-height:1.35; display:flex; flex-direction:column; min-width:0; border:1.5px solid transparent; }
.mrow .t span.n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mrow .t.a { background:var(--ta-50); padding-right:40px; } .mrow .t.b { background:var(--tb-50); text-align:right; padding-left:40px; }
.mrow .t small { font-size:10.5px; font-weight:800; }
.mrow .t.a small { color:var(--ta); } .mrow .t.b small { color:var(--tb); }
.mcard[data-win="a"] .t.a { background:var(--ta-100); border-color:var(--ta); }
.mcard[data-win="b"] .t.b { background:var(--tb-100); border-color:var(--tb); }
.mcard[data-win="a"] .t.b, .mcard[data-win="b"] .t.a { opacity:.6; }
.gin { display:flex; align-items:center; gap:5px; flex:none; }
.gin .colon { color:#A0A8B8; font-weight:800; }
.wl { position:absolute; top:50%; transform:translateY(-50%) rotate(-8deg); font-family:var(--font); font-weight:900; font-size:15px; line-height:1; padding:4px 6px 3px; border-radius:7px; border:2px solid currentColor; }
.t.a .wl { right:6px; } .t.b .wl { left:6px; }
.wl.w { color:#fff; background:var(--win); border-color:var(--win); }
.wl.l { color:#8B93A5; background:#fff; }
.wl:empty { display:none; }
table.rec { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13px; }
.rec th, .rec td { padding:7px 10px; border-bottom:1px solid var(--line-2); text-align:left; }
.rec th { background:var(--surface-2); font-size:12px; color:var(--text-2); font-weight:700; }
.rec td.n { font-weight:700; }
.rec td.r { font-variant-numeric:tabular-nums; color:var(--text-2); white-space:nowrap; }
.rec td.r b { color:var(--text); }
.rec tr:last-child td { border-bottom:0; }

/* 전체 */
.seedgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.scard { text-align:left; background:#fff; border:1px solid var(--line); border-top:4px solid var(--sc); border-radius:12px; padding:10px 12px; cursor:pointer; min-width:0; }
.scard .h { display:flex; justify-content:space-between; align-items:center; font-weight:800; color:var(--sc); font-size:14px; }
.scard .h small { font-weight:500; color:var(--text-2); font-size:11px; }
.scard .v { font-family:var(--brand); font-size:28px; line-height:1.15; margin-top:2px; }
.scard .v .a { color:var(--ta); } .scard .v .b { color:var(--tb); } .scard .v i { font-style:normal; color:#B5BCCB; margin:0 5px; }
.scard .lw { font-size:11.5px; font-weight:800; }
.scard .lw.a { color:var(--ta); } .scard .lw.b { color:var(--tb); } .scard .lw.d { color:var(--text-2); }
.nowgrid .ctitle { font-weight:800; font-size:13px; color:var(--navy); margin:12px 2px 0; display:flex; justify-content:space-between; gap:2px 8px; flex-wrap:wrap; }
.nowgrid .ctitle small { font-weight:500; color:var(--text-2); }
.resgrid { display:flex; flex-direction:column; gap:8px; }
.res { background:#fff; border:1px solid var(--line); border-left:4px solid var(--sc); border-radius:12px; padding:8px 10px; }
.res .rh { display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:800; color:var(--sc); margin-bottom:6px; }
.res .rh span:last-child { font-family:var(--brand); font-weight:400; font-size:17px; color:var(--text); }
.res .rh .a { color:var(--ta); } .res .rh .b { color:var(--tb); }
.res .rg { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; }
.rc { border:1.5px solid var(--line); background:var(--surface-2); border-radius:8px; padding:3px 2px; text-align:center; cursor:pointer; font-size:10.5px; line-height:1.25; color:var(--text-2); min-width:0; }
.rc b { display:block; font-size:12.5px; color:var(--text); }
.rc.a { background:var(--ta); border-color:var(--ta); color:#fff; } .rc.a b { color:#fff; }
.rc.b { background:var(--tb); border-color:var(--tb); color:#fff; } .rc.b b { color:#fff; }
.rc.live { border-color:var(--yellow); background:var(--yellow-50); color:#8A6500; }
.tl { display:grid; grid-template-columns:30px repeat(3,minmax(0,1fr)); gap:4px; }
.tl .hd { font-size:11.5px; font-weight:700; color:var(--text-2); text-align:center; padding:2px 0; }
.tl .hd small { display:block; font-size:10px; font-weight:500; }
.tl .tw { display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; color:var(--navy); background:#fff; border:1px solid var(--line); border-radius:8px; }
.tl .tw.cur { background:var(--yellow); border-color:var(--yellow); }
.tcell { display:block; width:100%; min-width:0; text-align:left; background:var(--sl); border:1.5px solid transparent; border-radius:8px; padding:4px 6px; font:12px/1.3 var(--font); color:var(--text); cursor:pointer; }
.tcell .tlb { display:block; font-size:10.5px; font-weight:800; color:var(--sc); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tcell .tn { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.tcell .tn.a { color:var(--ta-d); } .tcell .tn.b { color:var(--tb-d); }
.tcell .ts { display:flex; align-items:center; gap:4px; font-weight:800; font-variant-numeric:tabular-nums; min-height:16px; }
.tcell .ts .w { font-size:10px; font-weight:800; color:#fff; border-radius:4px; padding:0 4px; }
.tcell .ts .w.a { background:var(--ta); } .tcell .ts .w.b { background:var(--tb); }
.tcell.done { background:#fff; border-color:var(--line-2); }
.tcell.done .tn { opacity:.75; }
.tcell[data-win="a"] { box-shadow:inset 3px 0 0 var(--ta); }
.tcell[data-win="b"] { box-shadow:inset 3px 0 0 var(--tb); }
.tcell.cur { border-color:var(--navy); box-shadow:0 0 0 1px var(--navy); }
.rules { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:12.5px; color:var(--text-2); line-height:1.65; }
.rules b { color:var(--text); }
.rules ul { margin:0; padding-left:18px; }

/* 관리 */
.admin { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:12px; }
.admin h3 { margin:0 0 8px; font-size:15px; }
.admin p { font-size:13px; color:var(--text-2); margin:6px 0; }
.admin input { width:120px; height:40px; border:1.5px solid var(--line); border-radius:8px; font:700 18px var(--font); text-align:center; letter-spacing:4px; }
.btn { border:0; border-radius:8px; padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; background:var(--navy); color:#fff; }
.btn.ghost { background:var(--navy-50); color:var(--navy); }
.btn.danger { background:var(--danger); }
.admin .row2 { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }

#toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--navy); color:#fff; font-size:13px; padding:9px 14px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .25s; max-width:90vw; text-align:center; z-index:50; }
#toast.on { opacity:1; }

/* 바로가기 */
.quick { display:flex; flex-wrap:wrap; gap:6px; margin:8px 2px 0; }
.qbtn { border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:20px; padding:4px 11px; font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:none; }
.qbtn.hl { background:var(--navy); color:#fff; border-color:var(--navy); }
.cbtns { display:flex; gap:6px; margin:6px 2px 0; flex-wrap:wrap; }

/* ───────── 태블릿 코트 점수판 (#k1 #k2 #k3) ───────── */
const $keeper = document.getElementById('keeper');
let KC = 1, kPick = null, kSwap = false, kPrev = {};
function keeperGame() { return (kPick && GAMES[kPick] && GAMES[kPick].c === KC) ? kPick : D.cur[KC]; }
function kOptLabel(gid) {
  const g = GAMES[gid], r = G(gid);
  return `${g.w}차례 · ${g.no}경기 ${r.done ? `(${TEAM[r.w]} 승 ${r.a}:${r.b})` : r.live ? '(경기 중)' : ''}`;
}
function renderKeeper(force) {
  const gid = keeperGame();
  const sg = `${KC}|${gid}|${kSwap}`;
  if (!force && $keeper.dataset.sig === sg) { patchKeeper(); return; }
  $keeper.dataset.sig = sg;
  const s = COURT_SEED[KC];
  const top = `<div class="k-top" style="${seedVars(s)}"><button class="k-btn" data-k="back">← 나가기</button><span class="t">${KC}코트 점수판</span><span class="sd">${s}시드</span>
    <select id="kSel" aria-label="경기 고르기">${COURTS[KC].map(x => `<option value="${x}" ${x === gid ? 'selected' : ''}>${kOptLabel(x)}</option>`).join('')}</select>
    <button class="k-btn" data-k="swap">좌우 바꾸기</button></div>`;
  if (!gid) { $keeper.innerHTML = top + `<div class="k-empty">${KC}코트 경기가 모두 끝났어요.<br>고칠 경기가 있으면 위에서 골라 주세요.</div>`; return; }
  const g = GAMES[gid];
  const sides = kSwap ? ['b','a'] : ['a','b'];
  $keeper.innerHTML = top + `
    <div class="k-info" id="kInfo"></div>
    <div class="k-pads">${sides.map(side => `<div class="k-side ${side}">
      <button class="k-pad" data-k="+${side}"><span class="tn">${TEAM[side]}팀</span><span class="nm">${esc(nm(g.s,side,g.i))} · ${esc(nm(g.s,side,g.j))}</span><span class="v" id="kv-${side}">0</span><span class="plus">눌러서 +1</span></button>
      <button class="k-minus" data-k="-${side}" aria-label="${TEAM[side]}팀 1점 빼기">−1</button></div>`).join('')}</div>
    <div class="k-bottom"><button class="k-finish" id="kFin" data-k="fin">경기 끝</button></div>`;
  kPrev = {};
  patchKeeper();
}
function patchKeeper() {
  const gid = keeperGame(); if (!gid) return;
  const g = GAMES[gid], r = G(gid);
  for (const side of ['a','b']) {
    const el = document.getElementById('kv-' + side); if (!el) continue;
    const v = String(r[side] ?? 0);
    if (el.textContent !== v) { el.textContent = v; if (kPrev[side] !== undefined) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } }
    kPrev[side] = v;
  }
  const idx = COURTS[KC].indexOf(gid), nx = COURTS[KC][idx + 1] ? GAMES[COURTS[KC][idx + 1]] : null;
  const info = document.getElementById('kInfo');
  if (info) info.innerHTML = `<b>${g.w}차례 · ${g.s}시드 ${g.no}경기</b> · 25점 단판${nx ? ` · 다음: ${pair(nx,'a')} vs ${pair(nx,'b')}` : ' · 이 코트 마지막 경기'}`;
  const fin = document.getElementById('kFin');
  if (fin) {
    fin.className = 'k-finish';
    if (r.done) { fin.classList.add('saved'); fin.textContent = `저장됨 · ${TEAM[r.w]}팀 승 (${r.a}:${r.b})`; }
    else if (r.a !== null && r.b !== null && r.a !== r.b) {
      const w = r.a > r.b ? 'a' : 'b';
      fin.classList.add(readyToFinish(r) ? 'ready' : 'ok');
      fin.textContent = `경기 끝 — ${TEAM[w]}팀 승 (${r.a}:${r.b})`;
    } else fin.textContent = '경기 끝 (점수가 같으면 못 끝내요)';
  }
  const sel = document.getElementById('kSel');
  if (sel && document.activeElement !== sel) [...sel.options].forEach(o => { const t = kOptLabel(o.value); if (o.textContent !== t) o.textContent = t; });
}
$keeper.addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const k = b.dataset.k, gid = keeperGame();
  if (k === 'back') { location.hash = '#c' + KC; return; }
  if (k === 'swap') { kSwap = !kSwap; renderKeeper(true); return; }
  if (!gid) return;
  if (k[0] === '+' || k[0] === '-') {
    const r = G(gid);
    if (r.done && !confirm('이미 끝난 경기예요. 점수를 고칠까요? (고친 뒤 다시 경기 끝을 눌러 주세요)')) return;
    if (r.done) kPick = gid;
    bump(gid, k[1], k[0] === '+' ? 1 : -1);
    return;
  }
  if (k === 'fin') {
    const r = G(gid); if (r.done) return;
    if (r.a === null || r.b === null || r.a === r.b) { toast('점수가 같으면 끝낼 수 없어요.'); return; }
    const w = r.a > r.b ? 'a' : 'b';
    if (!confirm(`${TEAM[w]}팀 승 (${r.a}:${r.b})으로 저장할까요?`)) return;
    if (finishGame(gid)) { kPick = null; renderKeeper(true); }
  }
});
$keeper.addEventListener('change', e => {
  if (e.target.id !== 'kSel') return;
  const v = e.target.value; kPick = (v === D.cur[KC]) ? null : v; renderKeeper(true);
});

/* ───────── 화면 고르기 (#tv · #k1~3 · 일반 탭) ───────── */
let MODE = 'app';
function route() {
  const h = location.hash.slice(1);
  if (h === 'tv') MODE = 'tv';
  else if (/^k[123]$/.test(h)) { if (KC !== +h[1]) { kPick = null; kSwap = false; } KC = +h[1]; MODE = 'keeper'; }
  else MODE = 'app';
  document.body.classList.toggle('tvmode', MODE === 'tv');
  document.body.classList.toggle('kmode', MODE === 'keeper');
  if (MODE === 'tv') { tvPrev = {}; renderTV(); return; }
  if (MODE === 'keeper') { renderKeeper(true); return; }
  renderBoard();
  let t = h;
  if (!TABS.includes(t)) { try { t = localStorage.getItem(KEY + ':tab') || 'all'; } catch (e) { t = 'all'; } }
  if (!TABS.includes(t)) t = 'all';
  setTab(t);
}

function renderView() {
  if (TAB === 'all') $view.innerHTML = viewAll();
  else if (TAB[0] === 'c') $view.innerHTML = viewCourt(+TAB[1]);
  else if (TAB[0] === 's') $view.innerHTML = viewSeed(+TAB[1]);
  else $view.innerHTML = viewAdmin();
  structSig = sig();
}
function patchView() {
  const ae = document.activeElement;
  $view.querySelectorAll('input.sc').forEach(el => {
    if (el === ae) return;
    const v = num((S[el.dataset.gid] || {})[el.dataset.side]);
    const str = v === null ? '' : String(v);
    if (el.value !== str) el.value = str;
  });
  $view.querySelectorAll('[data-card]').forEach(el => {
    const gid = el.dataset.card, r = G(gid), nw = r.w || '';
    if (el.dataset.win !== nw) {
      el.dataset.win = nw;
      if (nw && el.classList.contains('mcard')) { el.classList.remove('just'); void el.offsetWidth; el.classList.add('just'); }
    }
    el.classList.toggle('done', r.done);
    if (el.classList.contains('gcard')) el.classList.toggle('now', D.cur[GAMES[gid].c] === gid);
  });
  $view.querySelectorAll('[data-live]').forEach(el => {
    const key = el.dataset.live;
    const h = liveHTML(key); if (el.innerHTML !== h) el.innerHTML = h;
    if (key.startsWith('wl:')) { const [gid, side] = key.slice(3).split('/'); el.className = 'wl ' + wlClass(gid, side); }
  });
}
// '전체 대결'의 지금 코트 카드는 코트별 지금 경기가 바뀌면 다시 그린다
let structSig = '';
function sig() { return TAB === 'all' ? [1,2,3].map(c => D.cur[c]).join(',') : ''; }
let dirty = false;
function typing() { const ae = document.activeElement; return !!(ae && ae.matches && ae.matches('input.sc') && $view.contains(ae)); }
function refresh() {
  derive();
  if (MODE === 'tv') { renderTV(); return; }
  if (MODE === 'keeper') { renderKeeper(); return; }
  renderBoard();
  if (TAB === 'admin') { const el = document.getElementById('connTxt'); if (el) el.textContent = connText(); return; }
  if (sig() === structSig) { patchView(); return; }
  if (typing()) { patchView(); dirty = true; return; }
  const y = window.scrollY; renderView(); window.scrollTo(0, y); dirty = false;
}
document.addEventListener('focusout', () => {
  setTimeout(() => { if (dirty && !typing()) { const y = window.scrollY; renderView(); window.scrollTo(0, y); dirty = false; } }, 120);
});

function setTab(t, gid) {
  if (!TABS.includes(t)) t = 'all';
  TAB = t;
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  try { localStorage.setItem(KEY + ':tab', t); } catch (e) {}
  if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  renderView();
  const target = gid ? $view.querySelector(`.gcard[data-card="${gid}"], .mcard[data-card="${gid}"]`)
    : (t[0] === 'c' && D.cur[+t[1]] ? $view.querySelector(`.gcard[data-card="${D.cur[+t[1]]}"]`) : null);
  if (target) {
    requestAnimationFrame(() => {
      target.scrollIntoView({ block:'center', behavior: gid ? 'smooth' : 'auto' });
      if (gid) { target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash'); }
    });
  } else {
    const bar = document.querySelector('.tabbar');
    if (window.scrollY > bar.offsetTop) window.scrollTo(0, bar.offsetTop);
  }
}

/* ───────── 입력 ───────── */
function commit(el) {
  const gid = el.dataset.gid, side = el.dataset.side;
  const v = el.value === '' ? null : Math.min(99, parseInt(el.value, 10));
  if (num((S[gid] || {})[side]) === v) return;
  setScore(gid, side, v);
}
$view.addEventListener('input', e => {
  const el = e.target; if (!el.matches('input.sc')) return;
  const clean = el.value.replace(/\D/g, '').slice(0, 2);
  if (el.value !== clean) el.value = clean;
  clearTimeout(el._t); el._t = setTimeout(() => commit(el), 700);
});
$view.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input.sc')) { clearTimeout(el._t); commit(el); }
  if (el.id === 'hideDone') {
    hideDone = el.checked;
    try { localStorage.setItem(KEY + ':hideDone', hideDone ? '1' : '0'); } catch (e2) {}
    const l = $view.querySelector('.clist'); if (l) l.classList.toggle('hide-done', hideDone);
  }
});
$view.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && el.matches('input.sc')) {
    e.preventDefault(); clearTimeout(el._t); commit(el);
    if (el.dataset.side === 'a') { const b = el.closest('[data-card]').querySelector('input.sc.b'); if (b) { b.focus(); b.select(); return; } }
    el.blur();
  }
  if (e.key === 'Enter' && el.id === 'pin') checkPin();
});
$view.addEventListener('focusin', e => { if (e.target.matches('input.sc')) setTimeout(() => { try { e.target.select(); } catch (x) {} }, 0); });

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { setTab(tb.dataset.tab); return; }
  const go = e.target.closest('[data-go]');
  if (go) { const [t, gid] = go.dataset.go.split('|'); setTab(t, gid); return; }
  const act = e.target.closest('[data-act]');
  if (act) adminAct(act.dataset.act);
});

/* ───────── 관리 ───────── */
function checkPin() {
  const el = document.getElementById('pin');
  if (el && el.value === PIN) { unlocked = true; try { sessionStorage.setItem(KEY + ':pin', '1'); } catch (e) {} renderView(); }
  else { toast('PIN이 맞지 않아요.'); if (el) { el.value = ''; el.focus(); } }
}
function adminAct(a) {
  if (a === 'pin') return checkPin();
  if (a === 'lock') { unlocked = false; try { sessionStorage.removeItem(KEY + ':pin'); } catch (e) {} renderView(); return; }
  if (a === 'backup') {
    const blob = new Blob([JSON.stringify({ key:KEY, savedAt:new Date().toISOString(), scores:S }, null, 1)], { type:'application/json' });
    const u = URL.createObjectURL(blob); const link = document.createElement('a');
    link.href = u; link.download = `청백전_점수백업_${new Date().toISOString().slice(0,16).replace(/[-:T]/g,'')}.json`;
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
    return;
  }
  if (a === 'reset') {
    if (!confirm('모든 점수를 지울까요? 모든 기기에서 사라지고 되돌릴 수 없어요.')) return;
    S = {}; saveLocal();
    if (cloud) cloud.remove().then(() => toast('점수를 모두 지웠어요.')).catch(() => toast('지우기 실패 — 인터넷이나 권한을 확인해 주세요.'));
    else toast('이 기기의 점수를 지웠어요.');
    refresh();
  }
}

/* ───────── 저장 · 실시간 연동 ───────── */
let cloud = null, connState = 'local';
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function loadLocal() { try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; } }
function connText() {
  return ({ ok:'실시간 연결됨 — 모든 기기에 바로 공유돼요.', off:'인터넷 연결이 끊겼어요. 다시 연결되면 자동으로 맞춰져요.', denied:'서버 저장 권한이 없어요. 지금은 이 기기에만 저장돼요.', local:'서버에 연결하지 않았어요. 이 기기에만 저장돼요.', wait:'연결 확인 중…' })[connState];
}
function showConn() {
  const el = document.getElementById('conn');
  el.className = 'conn' + (connState === 'ok' ? ' ok' : (connState === 'denied' || connState === 'off') ? ' bad' : '');
  el.textContent = ({ ok:'실시간 연결됨', off:'연결 끊김', denied:'저장 권한 없음', local:'이 기기에만 저장', wait:'연결 확인 중' })[connState];
  const t = document.getElementById('connTxt'); if (t) t.textContent = connText();
}
// 칸에 직접 쓴 점수 = 최종 점수(경기 중 표시를 지운다)
function setScore(gid, side, v) {
  const before = G(gid).done;
  const cur = Object.assign({}, S[gid] || {});
  if (v === null) delete cur[side]; else cur[side] = v;
  delete cur.p;
  cur.t = Date.now();
  const empty = cur.a === undefined && cur.b === undefined;
  if (empty) delete S[gid]; else S[gid] = cur;
  saveLocal(); refresh();
  const r = G(gid), g = GAMES[gid];
  if (!before && r.done) toast(`${g.s}시드 ${g.no}경기 끝! ${TEAM[r.w]}팀 1승 (${r.a}:${r.b})`);
  if (!cloud) return;
  const p = empty ? cloud.child(gid).remove()
    : cloud.child(gid).update({ [side]: v === null ? null : v, p: null, t: firebase.database.ServerValue.TIMESTAMP });
  p.catch(() => toast('저장이 안 됐어요. 인터넷이나 권한을 확인해 주세요.'));
}
// 태블릿 점수판: 1점 올리기/내리기 (경기 중으로 표시)
function bump(gid, side, d) {
  const other = side === 'a' ? 'b' : 'a';
  const cur = Object.assign({}, S[gid] || {});
  cur[side] = Math.max(0, Math.min(99, (num(cur[side]) || 0) + d));
  if (num(cur[other]) === null) cur[other] = 0;
  cur.p = 1; cur.t = Date.now();
  S[gid] = cur; saveLocal(); refresh();
  if (!cloud) return;
  const ref = cloud.child(gid);
  const fail = () => toast('저장이 안 됐어요. 인터넷을 확인해 주세요.');
  ref.child(side).transaction(x => Math.max(0, Math.min(99, (num(x) || 0) + d))).catch(fail);
  ref.child(other).transaction(x => (num(x) === null ? 0 : x)).catch(fail);
  ref.update({ p: 1, t: firebase.database.ServerValue.TIMESTAMP }).catch(fail);
}
// 경기 끝: 경기 중 표시를 지워 끝난 경기로 만든다
function finishGame(gid) {
  const r = G(gid), g = GAMES[gid];
  if (r.a === null || r.b === null || r.a === r.b) { toast('점수가 같으면 끝낼 수 없어요.'); return false; }
  const cur = Object.assign({}, S[gid] || {}); delete cur.p; cur.t = Date.now();
  S[gid] = cur; saveLocal(); refresh();
  const w = r.a > r.b ? 'a' : 'b';
  toast(`${g.s}시드 ${g.no}경기 끝! ${TEAM[w]}팀 1승 (${r.a}:${r.b})`);
  if (cloud) cloud.child(gid).update({ p: null, t: firebase.database.ServerValue.TIMESTAMP }).catch(() => toast('저장이 안 됐어요. 인터넷을 확인해 주세요.'));
  return true;
}
function initCloud() {
  if (!window.firebase || !window.FIREBASE_CONFIG) { connState = 'local'; showConn(); return; }
  try {
    firebase.initializeApp(window.FIREBASE_CONFIG);
    const db = firebase.database();
    cloud = db.ref(KEY + '/scores');
    connState = 'wait'; showConn();
    cloud.on('value', snap => {
      S = snap.val() || {}; saveLocal();
      if (connState !== 'off') connState = 'ok';
      showConn(); refresh();
    }, () => { connState = 'denied'; cloud = null; showConn(); });
    db.ref('.info/connected').on('value', s => {
      if (s.val()) { if (connState === 'off' || connState === 'wait') connState = cloud ? 'ok' : connState; }
      else if (connState === 'ok') connState = 'off';
      showConn();
    });
  } catch (e) { connState = 'local'; cloud = null; showConn(); }
}

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ───────── 시작 ───────── */
loadLocal();
derive();
route();
showConn();
initCloud();
window.addEventListener('hashchange', () => {
  const t = location.hash.slice(1);
  if (MODE === 'app' && TABS.includes(t)) { if (t !== TAB) setTab(t); return; }
  route();
});

/* ───────── 앱 설치 (홈 화면에 추가) ───────── */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  const b = document.getElementById('installBtn'); if (b) b.hidden = false;
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch (e) {}
  installEvt = null; document.getElementById('installBtn').hidden = true;
});
window.addEventListener('appinstalled', () => { const b = document.getElementById('installBtn'); if (b) b.hidden = true; toast('앱으로 설치됐어요.'); });
</script>
</body>
